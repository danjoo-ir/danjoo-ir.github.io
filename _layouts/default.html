<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{page.title}} | {{site.name}}</title>
    <meta name="theme-color" content="#aa00ff" />
    {% seo %}
    <link rel="shortcut icon" type="image/x-icon" href="{{site.baseurl}}/{{site.favicon}}">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{{site.baseurl}}/assets/font/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="{{site.baseurl}}/assets/css/bootstrap.css">
    <link rel="stylesheet" href="{{site.baseurl}}/assets/css/theme.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.slim.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
    <a class="navbar-brand font-weight-bolder mr-3" href="/">
        <img src="{{site.baseurl}}/{{site.logo}}" width="60px" style="border-radius: 100%;" alt="دانجو"></a>
    <button class="navbar-light navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsDefault" aria-controls="navbarsDefault" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarsDefault">
    <ul class="navbar-nav ml-auto align-items-center">
    {% include menu-header.html %}
    </ul>
    </div>
    </nav>
    <div id="lunrsearchresults">
        <ul class="mb-0"></ul>
    </div>
    <main role="main">
        {{ content }}
    </main>
    <footer class="footer pt-2 pb-2 text-center">
    <div class="container">
          <div class="socials-media">
            <ul class="list-unstyled">
              {% include footer-social.html %}
            </ul>
          </div>
          {% include footer-copyright.html %}
        </div>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.1/umd/popper.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="{{site.baseurl}}/assets/js/theme.js"></script>
    <script src="{{site.baseurl}}/assets/js/lunr.js"></script>
</body>
</html>
