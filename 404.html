<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>صفحه پیدا نشد | دانجو</title>
<meta name="description" content="صفحه‌ای که به دنبال آن بودید پیدا نشد. به کلاس درس برگردید و درس مورد نظرتان را پیدا کنید." />
<style>
  :root {
    --primary: #4361ee;
    --secondary: #f72585;
    --accent: #ffd60a;
    --bg-start: #eef2ff;
    --bg-end: #fdf0f6;
    --text-dark: #22223b;
    --text-muted: #6c6c80;
    --card-bg: #ffffff;
    --radius: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    font-family: "Vazirmatn", Tahoma, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    color: var(--text-dark);
    padding: clamp(16px, 5vw, 48px);
    overflow-x: hidden;
    position: relative;
  }

  .decor {
    position: absolute;
    border-radius: 50%;
    opacity: 0.35;
    filter: blur(2px);
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
  }
  .decor.d1 { width: 90px; height: 90px; background: var(--accent); top: 8%; left: 6%; animation-delay: 0s; }
  .decor.d2 { width: 60px; height: 60px; background: var(--secondary); top: 70%; left: 12%; animation-delay: 1.2s; }
  .decor.d3 { width: 70px; height: 70px; background: var(--primary); top: 15%; right: 8%; animation-delay: 0.6s; }
  .decor.d4 { width: 45px; height: 45px; background: var(--accent); top: 78%; right: 14%; animation-delay: 1.8s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: 0 24px 60px -20px rgba(67, 97, 238, 0.35);
    padding: clamp(32px, 6vw, 64px);
    text-align: center;
  }

  .mascot {
    width: clamp(110px, 20vw, 160px);
    height: auto;
    margin: 0 auto 8px;
    animation: bounce 2.4s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .error-code {
    font-size: clamp(56px, 12vw, 96px);
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-top: 8px;
    letter-spacing: 2px;
  }

  .title {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 700;
    margin-top: 12px;
  }

  .subtitle {
    font-size: clamp(15px, 2.6vw, 18px);
    color: var(--text-muted);
    margin-top: 12px;
    line-height: 1.9;
    max-width: 520px;
    margin-inline: auto;
  }

  .search-box {
    margin-top: 28px;
    display: flex;
    gap: 8px;
    max-width: 420px;
    margin-inline: auto;
  }

  .search-box input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 14px;
    border: 2px solid #e5e7f5;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease;
    font-family: inherit;
  }
  .search-box input:focus { border-color: var(--primary); }

  .search-box button {
    padding: 12px 20px;
    border-radius: 14px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
    font-family: inherit;
  }
  .search-box button:hover { background: #3247c5; transform: translateY(-1px); }
  .search-box button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .actions {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .btn-primary {
    background: var(--secondary);
    color: #fff;
    box-shadow: 0 10px 24px -8px rgba(247, 37, 133, 0.5);
  }
  .btn-primary:hover { transform: translateY(-2px); }

  .btn-ghost {
    background: #f1f2fb;
    color: var(--text-dark);
  }
  .btn-ghost:hover { transform: translateY(-2px); background: #e6e8fb; }

  .grades {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .grade-chip {
    background: #f8f9fe;
    border: 1px solid #e5e7f5;
    color: var(--text-muted);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .grade-chip:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

  @media (max-width: 480px) {
    .search-box { flex-direction: column; }
    .actions { flex-direction: column; }
    .btn { justify-content: center; }
  }
</style>
</head>
<body>

<span class="decor d1"></span>
<span class="decor d2"></span>
<span class="decor d3"></span>
<span class="decor d4"></span>

<main class="card" role="main">
  <svg class="mascot" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="شخصیت کارتونی کتاب و مداد که نشان‌دهنده صفحه یافت نشد است">
    <circle cx="100" cy="100" r="90" fill="#f1f2fb"/>
    <rect x="55" y="70" width="90" height="65" rx="8" fill="#4361ee"/>
    <rect x="55" y="70" width="90" height="14" rx="8" fill="#3247c5"/>
    <rect x="65" y="95" width="70" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="65" y="110" width="50" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
    <path d="M120 60 L150 30 L160 40 L130 70 Z" fill="#ffd60a"/>
    <path d="M150 30 L158 22 L166 30 L160 40 Z" fill="#f72585"/>
    <circle cx="70" cy="145" r="6" fill="#f72585"/>
    <circle cx="90" cy="150" r="4" fill="#4361ee"/>
    <circle cx="110" cy="145" r="5" fill="#ffd60a"/>
  </svg>

  <p class="error-code">۴۰۴</p>
  <h1 class="title">اوه! این درس هنوز نوشته نشده 📚</h1>
  <p class="subtitle">
    صفحه‌ای که دنبالش بودید پیدا نشد؛ شاید آدرس اشتباه تایپ شده یا این درس هنوز به سایت اضافه نشده باشد.
    می‌توانید از کادر زیر جست‌وجو کنید یا به صفحه اصلی برگردید.
  </p>

  <div class="actions">
    <a class="btn btn-primary" href="/">🏠 بازگشت به صفحه اصلی</a>
    <a class="btn btn-ghost" href="javascript:history.back()">↩️ برگشت به صفحه قبل</a>
  </div>

  <div class="grades" aria-label="میانبر پایه‌های تحصیلی">
    <a class="grade-chip" href="/">پایه اول</a>
    <a class="grade-chip" href="/">پایه دوم</a>
    <a class="grade-chip" href="/">پایه سوم</a>
    <a class="grade-chip" href="/">پایه چهارم</a>
    <a class="grade-chip" href="/">پایه پنجم</a>
    <a class="grade-chip" href="/">پایه ششم</a>
  </div>
</main>

<script>
  function handleSearch(event) {
    var input = document.getElementById('q');
    if (!input.value.trim()) {
      event.preventDefault();
      input.focus();
      return false;
    }
    return true;
  }
</script>

</body>
</html>
